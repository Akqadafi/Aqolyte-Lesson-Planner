<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Lesson Plan Prompt</title>
</head>
<body>
    <h1>Select a Lesson Plan Style</h1>
    <form method="POST">
        <label for="prompt">Select a Prompt:</label><br>
        <select id="prompt" name="prompt">
            <option value="prompt0">Webquest</option>
            <option value="prompt1">Basic Lesson Plan</option>
            <option value="prompt2">Concept Building Lesson Plan</option>
            <option value="prompt3">Skill Development Lesson Plan</option>
            <option value="prompt4">Reading Lesson Plan</option>
            <option value="prompt5">Exploration Lesson Plan</option>
        </select><br>
        <br><br>
        <input type="submit" value="Proceed">
    </form>
</body>
</html>
