<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worksheet Input Form</title>
</head>
<body>
    <h2>Worksheet Input Form</h2>
    <form action="/worksheet" method="post">
        <label for="topic">Topic:</label>
        <input type="text" id="topic" name="topic" required>
        <br><br>
        <label for="question_types">Select Type of Questions:</label>
        <select name="question_types" id="question_types">
            <option value="Short Answer Questions">Short Answer Questions</option>
            <option value="Fill in the Blanks">Fill in the Blanks</option>
            <option value="Matching">Matching Definitions</option>
            <option value="Mix">Mix</option>
        </select>
        <br><br>
        <label for="num_questions">Number of Questions:</label>
        <input type="number" id="num_questions" name="num_questions" min="1" required>
        <br><br>
        <label for="delimiter">Delimiter to Separate Questions:</label>
        <select name="delimiter" id="delimiter">
            <option value="----">Horizontal Line (----)</option>
            <option value="###">Hashes (###)</option>
            <option value="[---]">Square Brackets ([---])</option>
            <option value="\n\n">Double Line Breaks</option>
            <option value=">>>">Special Characters (>>>)</option>
        </select>
        <br><br>
        <input type="submit" value="Generate Worksheet">
    </form>
</body>
</html>
